name: Analyze SIVAlliu
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-sivalliu.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify source
        run: |
          curl --fail --location --retry 3 -o source.xapk 'https://github.com/ColombiaTransit/gtfs-valledupar/releases/download/source-sivalliu-3.2.10/SIVAlliu_3.2.10_APKPure.xapk'
          echo 'ae6c8e188903f55ae35aea69b9efeebee3538ae0d486def7c8ebf3005f5339e2  source.xapk' | sha256sum -c -
          mkdir -p native report
          python3 - <<'PY'
          import zipfile, io, pathlib
          with zipfile.ZipFile('source.xapk') as outer:
              for name in outer.namelist():
                  if not name.endswith('.apk'):
                      continue
                  with zipfile.ZipFile(io.BytesIO(outer.read(name))) as apk:
                      for member in apk.namelist():
                          if member in ('lib/arm64-v8a/libapp.so', 'lib/arm64-v8a/libflutter.so'):
                              target = pathlib.Path('native') / pathlib.Path(member).name
                              data = apk.read(member)
                              if target.exists() and target.read_bytes() != data:
                                  raise ValueError('Conflicting native libraries')
                              target.write_bytes(data)
                              print(name, member, len(data))
          for name in ('libapp.so', 'libflutter.so'):
              assert (pathlib.Path('native') / name).exists(), name
          PY
      - name: Install Blutter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyelftools python3-requests git cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev
          git clone https://github.com/worawit/blutter.git "$RUNNER_TEMP/blutter"
          git -C "$RUNNER_TEMP/blutter" checkout 4a60ac648bf448c5a7596437243bcd0b9376fdf0
      - name: Analyze native Dart code
        run: /usr/bin/python3 "$RUNNER_TEMP/blutter/blutter.py" "$PWD/native" "$RUNNER_TEMP/blutter-out"
      - name: Summarize transit symbols
        run: |
          python3 - <<'PY'
          import pathlib, os, re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'blutter-out'
          pattern=re.compile(r'transport-network|find-route|show-buses|getTransportAllStops|getTransportPolylineRoute|refreshDataRoutesAndStops|refreshDataVehiclesToStop|AllRoutes|AllStop|AllPolylineRoutes|VehicleToRoute|VehicleToStopModel',re.I)
          rows=[]
          for f in sorted(root.rglob('*')):
              if not f.is_file() or f.suffix not in ('.dart','.txt','.asm'):
                  continue
              for i,line in enumerate(f.read_text(errors='replace').splitlines(),1):
                  for match in pattern.finditer(line):
                      rows.append(f'{f.relative_to(root)}:{i}: {match.group()}')
          pathlib.Path('report/transit-symbols.txt').write_text('\n'.join(rows)+'\n')
          print('Transit symbol matches:',len(rows))
          print('\n'.join(rows[:300]))
          PY
      - name: Extract transport request and model evidence
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'blutter-out'
          out=pathlib.Path('report')
          base=root/'asm/sivalliu/view/mapa_home_screen/home_screen'
          # Emit only transport-specific references, not arbitrary object-pool
          # strings or unrelated account/payment credentials.
          allow=re.compile(r'(?i)transport-network|find-route|show-buses|city_id|with_polyline|route_id|stop_id|route_short_name|stop_name|latitude|longitude|coordinates|polyline|start_stop|end_stop|time_user_stop|frequency|headway|duration|distance|content-type|application/json|authorization|bearer|\\bpost\\b|\\bget\\b|jsonencode|jsondecode|fromJson|\\b(?:routes|stops|vehicles|data|method|body|headers|action|type)\\b')
          files=list(base.glob('repository/*.dart'))+list(base.glob('models/*.dart'))
          for f in sorted(files):
              if not re.search(r'transport|vehicle|route|stop',f.name,re.I):
                  continue
              rows=f.read_text(errors='replace').splitlines()
              result=[]
              for i,line in enumerate(rows,1):
                  if re.search(r'^\\s*(?:class |// (?:addr|[A-Za-z_]+\\())',line):
                      result.append(f'{i}: '+line[:250])
                  elif allow.search(line):
                      # Retain only allowlisted terms and instruction prefixes.
                      matches=[m.group() for m in allow.finditer(line)]
                      prefix=line.split(';')[0][:100]
                      if 'String:' in prefix or '"' in prefix or "'" in prefix:
                          prefix=''
                      result.append(f'{i}: {prefix} | '+', '.join(matches))
              (out/(f.stem+'-evidence.txt')).write_text('\\n'.join(result)+'\\n')
              print('FILE',f.name,'evidence rows',len(result))
              for row in result[:300]:
                  print(row)
          PY
      - name: Upload transit research index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sivalliu-transit-index
          path: report/
          retention-days: 7
