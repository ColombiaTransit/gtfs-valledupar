name: Collect SIVAlliu static network
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/scrape_sivalliu.py
      - .github/workflows/scrape-sivalliu.yml
permissions:
  contents: write
concurrency:
  group: sivalliu-static
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Collect network and route details
        run: |
          python3 -m py_compile scripts/scrape_sivalliu.py
          python3 scripts/scrape_sivalliu.py
      - name: Upload collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sivalliu-static-snapshot
          path: snapshot/
          retention-days: 30
      - name: Archive complete snapshot
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p data/sivalliu
          cp -a snapshot/. data/sivalliu/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sivalliu
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive SIVAlliu static API snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
